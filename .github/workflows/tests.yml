name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        # Oldest supported Python; current Linux and macOS runners no longer offer it.
        include:
          - os: windows-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install time zone data (Windows has none built in)
        run: python -m pip install tzdata
      - name: Run tests
        run: python -m unittest discover -s tests -v
