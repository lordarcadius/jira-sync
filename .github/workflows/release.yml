name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that SKILL.md has the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^\s+version: \"?${version}\"?\s*$" SKILL.md || { echo "SKILL.md metadata.version is not ${version}"; exit 1; }
      - name: Publish the CHANGELOG.md section as the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## " v " ") == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "Jira Sync ${version}" --notes-file notes.md
